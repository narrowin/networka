version: '3'

vars:
  PACKAGE_NAME: network_toolkit

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  install:
    desc: Install development dependencies
    cmds:
      - echo "Installing development dependencies..."
      - uv sync --locked --group dev --extra docs
    sources:
      - pyproject.toml
      - uv.lock
    generates:
      - .venv/**

  format:
    desc: Format code with ruff
    cmds:
      - echo "Formatting code..."
      - uv run --locked ruff format .
    sources:
      - src/**/*.py
      - tests/**/*.py

  format:check:
    desc: Check code formatting with ruff
    cmds:
      - echo "Checking code formatting..."
      - uv run --locked ruff format --check .
    sources:
      - src/**/*.py
      - tests/**/*.py

  lint:
    desc: Lint code with ruff
    cmds:
      - echo "Linting code..."
      - uv run --locked ruff check .
    sources:
      - src/**/*.py
      - tests/**/*.py

  lint:fix:
    desc: Lint and fix code with ruff
    cmds:
      - echo "Linting and fixing code..."
      - uv run --locked ruff check --fix .
    sources:
      - src/**/*.py
      - tests/**/*.py

  typecheck:
    desc: Type check with mypy
    cmds:
      - echo "Type checking..."
      - uv run --locked mypy src/
    sources:
      - src/**/*.py
      - pyproject.toml

  test:
    desc: Run tests (local development)
    cmds:
      - echo "Running tests (local development mode)..."
      - uv run --locked pytest -v
    sources:
      - src/**/*.py
      - tests/**/*.py
      - pyproject.toml

  test:ci:
    desc: Run the CI test command on the local interpreter
    env:
      FORCE_COLOR: "1"
      PYTHONUNBUFFERED: "1"
      CI: "true"
      COLUMNS: "150"
    cmds:
      - uv run --locked python --version
      - uv run --locked pytest --cov={{.PACKAGE_NAME}} --cov-report=xml --cov-report=term-missing
    sources:
      - src/**/*.py
      - tests/**/*.py
      - pyproject.toml
    generates:
      - coverage.xml
      - .coverage

  test:cov:
    desc: Run tests with coverage (local HTML report)
    cmds:
      - echo "Running tests with HTML coverage..."
      - uv run --locked pytest --cov={{.PACKAGE_NAME}} --cov-report=term-missing --cov-report=html
    sources:
      - src/**/*.py
      - tests/**/*.py
    generates:
      - htmlcov/**
      - .coverage

  test:fast:
    desc: Run tests in parallel (no coverage)
    cmds:
      - echo "Running tests in parallel..."
      - uv run --locked pytest -n auto
    sources:
      - src/**/*.py
      - tests/**/*.py

  security:
    desc: Run security checks
    cmds:
      - echo "Running security checks..."
      - uv run --locked bandit -r src/ -f json -o bandit-report.json || true
      - echo "Security report saved to bandit-report.json"
    sources:
      - src/**/*.py
    generates:
      - bandit-report.json

  secrets:
    desc: Scan for secrets
    cmds:
      - echo "Scanning for secrets..."
      - uv run --locked detect-secrets scan --all-files --baseline .secrets.baseline
    sources:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"

  check:
    desc: Run all quality checks
    deps:
      - lint
      - typecheck
      - test
    cmds:
      - echo "All checks passed!"

  build:
    desc: Build package for GitHub release
    cmds:
      - echo "Building package for GitHub distribution..."
      - rm -rf dist/
      - uv build --no-sources
      - echo "Built files:"
      - ls -la dist/
    sources:
      - src/**/*.py
      - pyproject.toml
      - README.md
      - CHANGELOG.md
    generates:
      - dist/**

  build:check:
    desc: Build and verify the wheel and source distribution in fresh environments
    cmds:
      - bash scripts/test-local-install.sh

  docs:generate:
    desc: Generate CLI documentation from Typer source
    cmds:
      - echo "Generating CLI documentation..."
      - uv run --locked python scripts/generate_cli_docs.py
    sources:
      - src/network_toolkit/**/*.py
      - scripts/generate_cli_docs.py
    generates:
      - docs/reference/cli.md

  docs:build:
    desc: Build documentation (regenerates CLI docs first)
    deps:
      - docs:generate
    cmds:
      - echo "Building MkDocs site..."
      - uv run --locked --extra docs mkdocs build --clean --strict

  clean:
    desc: Clean build artifacts
    cmds:
      - echo "Cleaning build artifacts..."
      - rm -rf build/
      - rm -rf dist/
      - rm -rf *.egg-info/
      - rm -rf .pytest_cache/
      - rm -rf .coverage
      - rm -rf htmlcov/
      - rm -rf .mypy_cache/
      - rm -rf .ruff_cache/
      - find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      - find . -type f -name "*.pyc" -delete 2>/dev/null || true
      - echo "Clean complete!"

  generate-docs:
    desc: Generate platform documentation from registry
    cmds:
      - echo "Generating platform documentation from registry..."
      - uv run --locked python scripts/generate_platform_docs.py

  docs:
    desc: Build documentation (regenerates CLI docs first)
    deps:
      - generate-docs
      - docs:build
    cmds:
      - echo "Documentation build complete."

  docs:serve:
    desc: Serve documentation locally with live reload (regenerates CLI docs first)
    deps:
      - generate-docs
      - docs:generate
    cmds:
      - echo "Serving documentation on http://0.0.0.0:8000 ..."
      - uv run --locked --extra docs mkdocs serve -a 0.0.0.0:8000

  docs:check-links:
    desc: Check documentation links locally (requires docs server to be running)
    cmds:
      - echo "Checking links with lychee via Docker..."
      - docker run --rm --network host -v "$(pwd):/input:ro" lycheeverse/lychee:latest --config /input/.lychee.toml "/input/**/*.md"

  docs:test:
    desc: Build docs and check links
    cmds:
      - task: docs
      - echo "Starting docs server in background..."
      - nohup uv run --locked --extra docs mkdocs serve -a 0.0.0.0:8000 > /dev/null 2>&1 &
      - sleep 3
      - task: docs:check-links
      - pkill -f "mkdocs serve" || true

  release:dry:
    desc: Test release script in dry-run mode
    interactive: true
    cmds:
      - echo "Testing release script..."
      - |
        read -p "Enter version (e.g., 1.0.0): " version
        ./scripts/release.sh --version "$version" --dry-run

  release:
    desc: Execute release using release script
    interactive: true
    cmds:
      - echo "WARNING - This will create a new release and push to GitHub"
      - echo "Make sure you are on main branch with clean working directory"
      - |
        read -p "Enter version (e.g., 1.0.0): " version
        read -p "Are you sure you want to release v$version? (y/N): " confirm
        if [ "$confirm" = "y" ] || [ "$confirm" = "Y" ]; then
          ./scripts/release.sh --version "$version"
        else
          echo "Release cancelled"
        fi

  dev:
    desc: Set up development environment and run checks
    deps:
      - install
      - lint:fix
      - typecheck
      - test
    cmds:
      - echo "Development environment ready!"

  ci:
    desc: Run local quality checks and the CI test command
    deps:
      - lint
      - format:check
      - typecheck
      - test:ci
      - security
    cmds:
      - echo "Local CI checks completed"

  publish:test:
    desc: Publish to TestPyPI for testing
    deps:
      - build
    cmds:
      - echo "Publishing to TestPyPI..."
      - uv run --locked twine upload --repository testpypi dist/*
      - echo "Published to TestPyPI - https://test.pypi.org/project/networka/"

  publish:pypi:
    desc: Publish to PyPI (production)
    deps:
      - build
    interactive: true
    cmds:
      - echo "WARNING - This will publish to PyPI production"
      - echo "Make sure the version is correct and tests have passed"
      - |
        read -p "Are you sure you want to publish to PyPI? (y/N): " confirm
        if [ "$confirm" = "y" ] || [ "$confirm" = "Y" ]; then
          uv run --locked twine upload dist/*
          echo "Published to PyPI - https://pypi.org/project/networka/"
        else
          echo "Publish cancelled"
        fi

  update:
    desc: Update dependencies
    cmds:
      - echo "Updating dependencies..."
      - uv sync --upgrade
    generates:
      - uv.lock

  shell:
    desc: Open a shell in the virtual environment
    cmds:
      - echo "Opening shell in virtual environment..."
      - uv run --locked "$SHELL"

  run:
    desc: Run the CLI tool (nw --help)
    cmds:
      - echo "Running networka CLI..."
      - uv run --locked nw --help

  run:info:
    desc: Show CLI info command
    cmds:
      - echo "Running nw info..."
      - uv run --locked nw info || echo "No devices configured yet"

  run:version:
    desc: Show CLI version
    cmds:
      - echo "Showing version..."
      - uv run --locked nw --version

  install:task:
    desc: Install go-task if not present
    cmds:
      - |
        if ! command -v task &> /dev/null; then
          echo "Installing go-task..."
          if command -v brew &> /dev/null; then
            brew install go-task
          elif command -v apt-get &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y wget
            wget -O task.deb https://github.com/go-task/task/releases/latest/download/task_linux_amd64.deb
            sudo dpkg -i task.deb
            rm task.deb
          elif command -v yum &> /dev/null; then
            sudo yum install -y wget
            wget -O task.rpm https://github.com/go-task/task/releases/latest/download/task_linux_amd64.rpm
            sudo rpm -i task.rpm
            rm task.rpm
          else
            echo "Please install go-task manually: https://taskfile.dev/installation/"
            exit 1
          fi
        else
          echo "go-task is already installed"
        fi
    status:
      - command -v task

  bootstrap:
    desc: Bootstrap the entire development environment
    deps:
      - install:task
      - install
    cmds:
      - echo "Bootstrap complete! Run 'task dev' to set up development environment."
