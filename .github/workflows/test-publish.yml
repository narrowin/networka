name: Test GitHub Installation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/test-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test-git-install:
    name: Test GitHub installation methods
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up uv and Python
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version-file: pyproject.toml
        python-version: "3.15"

    - name: Test direct Git installation
      shell: bash
      run: |
        tempdir="$(mktemp -d)"
        trap 'rm -rf "$tempdir"' EXIT
        unset PYTHONPATH
        cd "$tempdir"
        uv venv --python 3.15
        uv pip install 'git+https://github.com/narrowin/networka.git@${{ github.sha }}'
        uv pip check
        uv run --no-project nw --help
        uv run --no-project nw --version
        uv run --no-project python -c 'from network_toolkit import NetworkaClient'

  test-local-build-install:
    name: Test local build and install
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        version-file: pyproject.toml
        python-version: "3.15"

    - name: Build package
      run: uv build --no-sources

    - name: Install each artifact in a clean environment
      shell: bash
      run: |
        tempdir="$(mktemp -d)"
        trap 'rm -rf "$tempdir"' EXIT
        unset PYTHONPATH
        for artifact in "$PWD"/dist/*.whl "$PWD"/dist/*.tar.gz; do
          envdir="$tempdir/$(basename "$artifact")-env"
          uv venv --python 3.15 "$envdir"
          uv pip install --python "$envdir/bin/python" "$artifact"
          uv pip check --python "$envdir/bin/python"
          (
            cd "$tempdir"
            uv run --no-project --python "$envdir/bin/python" nw --help
            uv run --no-project --python "$envdir/bin/python" nw --version
            uv run --no-project --python "$envdir/bin/python" python -c 'from network_toolkit import NetworkaClient'
          )
        done
