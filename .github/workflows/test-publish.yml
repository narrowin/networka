name: Test GitHub Installation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/test-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test-git-install:
    name: Test GitHub installation methods
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test direct Git installation
      run: |
        python -m pip install --upgrade pip
        python -m pip install git+https://github.com/narrowin/networka.git@${{ github.sha }}

    - name: Test installed package
      run: |
        nw --help
        python -c "import network_toolkit; print('[OK] Import successful')"
        nw --version

    - name: Uninstall for next test
      run: python -m pip uninstall -y networka

  test-local-build-install:
    name: Test local build and install
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        version-file: pyproject.toml
        python-version: "3.12"

    - name: Build package
      run: uv build --no-sources

    - name: Install each artifact in a clean environment
      shell: bash
      run: |
        for artifact in dist/*.whl dist/*.tar.gz; do
          envdir="$(mktemp -d)"
          uv venv --python 3.12 "$envdir"
          uv pip install --python "$envdir/bin/python" "$artifact"
          "$envdir/bin/nw" --help
          "$envdir/bin/nw" --version
          "$envdir/bin/python" -c 'from network_toolkit import NetworkaClient'
        done
