name: CI

on:
  # Only run on pull requests to validate before merging
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "Taskfile.yml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/**"

  # Allow manual trigger for pre-release checks
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    name: Quality Checks
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    uses: ./.github/workflows/quality-checks.yml
    with:
      python-version: ${{ matrix.python-version }}
