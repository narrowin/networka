name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build distribution
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Ensure we get the full history and the latest commit
        fetch-depth: 0

    - name: Verify version consistency
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        FILE_VERSION=$(grep -o '__version__ = "[^"]*"' src/network_toolkit/__about__.py | cut -d'"' -f2)
        echo "Tag version: $TAG_VERSION"
        echo "File version: $FILE_VERSION"
        if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
          echo "ERROR: Version mismatch! Tag: $TAG_VERSION, File: $FILE_VERSION"
          echo "This usually means the tag was created before the version bump commit."
          echo "Please check the release process."
          exit 1
        fi
        echo "Version consistency verified"

    - name: Install uv
      uses: astral-sh/setup-uv@v10
      with:
        version-file: pyproject.toml
        python-version: "3.13"

    - name: Check lock and classify the release
      id: channel
      run: |
        uv lock --check
        uv run --locked python - <<'PYTHON'
        import os
        from packaging.version import Version
        raw = os.environ["GITHUB_REF_NAME"].removeprefix("v")
        version = Version(raw)
        if str(version) != raw or version.local is not None:
            raise SystemExit(f"Expected a canonical public version, got {raw!r}")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            print(f"prerelease={str(version.is_prerelease).lower()}", file=output)
        PYTHON

    - name: Build package
      run: uv build --no-sources

    - name: Verify built package version
      run: |
        TAG_VERSION="${GITHUB_REF#refs/tags/v}"
        # Extract version from built wheel filename
        WHEEL_FILE=$(ls dist/*.whl | head -1)
        WHEEL_VERSION=$(basename "$WHEEL_FILE" | cut -d'-' -f2)
        echo "Built wheel version: $WHEEL_VERSION"
        if [ "$TAG_VERSION" != "$WHEEL_VERSION" ]; then
          echo "ERROR: Built package version mismatch! Tag: $TAG_VERSION, Wheel: $WHEEL_VERSION"
          exit 1
        fi
        echo "Built package version verified"

    - name: Check build artifacts
      run: |
        ls -la dist/
        echo "[OK] Built packages:"
        file dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
        retention-days: 90

  test-built-package:
    name: Test built package
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Install and run each distribution independently
      shell: python
      run: |
        import os
        import subprocess
        import sys
        import tempfile
        from pathlib import Path

        for suffix in ("*.whl", "*.tar.gz"):
            artifact, = Path("dist").glob(suffix)
            with tempfile.TemporaryDirectory() as directory:
                subprocess.run([sys.executable, "-m", "venv", directory], check=True)
                bin_dir = Path(directory, "Scripts" if os.name == "nt" else "bin")
                python = bin_dir / ("python.exe" if os.name == "nt" else "python")
                nw = bin_dir / ("nw.exe" if os.name == "nt" else "nw")
                subprocess.run([python, "-m", "pip", "install", artifact.resolve()], check=True)
                subprocess.run([nw, "--version"], cwd=directory, check=True)
                subprocess.run([nw, "--help"], cwd=directory, check=True)

  create-release:
    name: Create GitHub Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build, test-built-package]
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Extract changelog for this tag
      shell: python
      run: |
        import os
        import re
        from pathlib import Path
        version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
        sections = re.split(r"^## ", Path("CHANGELOG.md").read_text(), flags=re.MULTILINE)
        notes = next((s.partition("\n")[2] for s in sections if s.startswith(f"[{version}]")), "")
        Path("release_notes.txt").write_text(notes.strip() + "\n")

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        body_path: release_notes.txt
        draft: false
        prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
        generate_release_notes: true

  publish:
    name: Publish verified package
    needs: [build, test-built-package]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.prerelease == 'true' && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ needs.build.outputs.prerelease == 'true' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          print-hash: true
          verify-metadata: true
