name: Quality Checks

on:
  workflow_call:

env:
  PYTHONUNBUFFERED: "1"
  UV_LOCKED: "true"
  UV_PYTHON: "3.15"

jobs:
  code-quality:
    name: Lint, Format, Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: pyproject.toml
          enable-cache: true

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: |
          uv sync --locked --group dev --extra docs
          uv run python -c "import os, sys; assert sys.version_info[:2] == tuple(map(int, os.environ['UV_PYTHON'].split('.')))"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: pyproject.toml
          enable-cache: true

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: |
          uv sync --locked --group dev --extra docs
          uv run python -c "import os, sys; assert sys.version_info[:2] == tuple(map(int, os.environ['UV_PYTHON'].split('.')))"

      - name: Run tests with coverage
        env:
          CI: "true"
          COLUMNS: "150"
        run: uv run pytest --cov=network_toolkit --cov-report=xml --cov-report=term-missing

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: pyproject.toml
          enable-cache: true

      - name: Set up Python
        run: uv python install "$UV_PYTHON"

      - name: Install dependencies
        run: |
          uv sync --locked --group dev --extra docs
          uv run python -c "import os, sys; assert sys.version_info[:2] == tuple(map(int, os.environ['UV_PYTHON'].split('.')))"

      - name: Security scan
        run: uv run bandit -r src -f json -o bandit-report.json
        continue-on-error: true

      - name: Secret detection
        uses: trufflesecurity/trufflehog@v3.100.1
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified
