name: Docs

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version-file: pyproject.toml
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev --extra docs

      - name: Validate documentation structure
        run: |
          echo "Checking for broken asset links..."
          if grep -r '\.\./assets/' docs/**/*.md; then
            echo "ERROR: Found relative asset paths using '../assets/'"
            echo "All asset references in docs/ should use 'assets/' (relative to docs root)"
            exit 1
          fi
          echo "Asset link validation passed"

      - name: Generate CLI documentation
        run: uv run --no-sync python scripts/generate_cli_docs.py

      - name: Generate platform documentation
        run: uv run --no-sync python scripts/generate_platform_docs.py

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict --verbose

      - name: Check build output
        run: |
          echo "Build output:"
          ls -lah site/
          echo "Total size:"
          du -sh site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
